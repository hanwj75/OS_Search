<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OS Search</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">OS</div>
          <div>
            <div class="brand-title">OS Search</div>
            <div class="brand-subtitle">Cisco EoX Lookup</div>
          </div>
        </div>

        <div class="mode-stack" aria-label="검색 모드 선택">
          <button type="button" class="mode-button is-active" data-target="os">OS 검색</button>
          <button type="button" class="mode-button" data-target="os-recommend">OS 추천</button>
          <button type="button" class="mode-button" data-target="hardware">HW 검색</button>
        </div>

        <div class="meta-block">
          <div class="meta-title">데이터 출처</div>
          <div class="meta-copy" id="data-source-copy">Cisco End-of-Life and End-of-Life (EoX) API</div>
        </div>
      </aside>

      <main class="content">
        <section class="hero">
          <div>
            <h1 id="hero-title">OS 만료기한 조회</h1>
            <p class="hero-copy" id="hero-copy">
              OS 버전과 선택형 OS 타입을 입력해 Cisco End-of-Support 정보를 조회합니다.
            </p>
          </div>
        </section>

        <section class="panel form-panel">
          <div class="panel-header">
            <h2>조회 입력</h2>
            <p id="search-panel-copy">여러 OS 버전은 쉼표로 구분해서 입력할 수 있습니다.</p>
          </div>

          <form id="search-form" class="search-form">
            <label class="field" id="hardware-lookup-field" hidden>
              <span>Hardware 조회 타입</span>
              <select id="hardware-lookup-type" name="hardwareLookupType">
                <option value="serial">Serial Number</option>
                <option value="pid">Product ID / PID</option>
              </select>
              <small>Cisco EoX API의 Product ID / Serial Number 조회를 사용합니다.</small>
            </label>

            <label class="field">
              <span id="search-input-label">OS 버전</span>
              <input
                id="search-values"
                name="searchValues"
                type="text"
                placeholder="예) 17.9.5, 17.11.1a, 10.3(6)"
                required
              />
              <small id="search-input-help">CLI와 동일하게 exact software release string 기준으로 조회합니다.</small>
            </label>

            <label class="field" id="os-type-field">
              <span>OS 타입 선택</span>
              <select id="os-type" name="osType">
                <option value="">자동/미지정</option>
                <option value="IOS-XE">IOS-XE</option>
                <option value="NX-OS">NX-OS</option>
                <option value="IOS">IOS</option>
                <option value="IOS XR">IOS XR</option>
                <option value="ASA">ASA</option>
                <option value="UCS NX-OS">UCS NX-OS</option>
              </select>
              <small>문서상 허용된 OSType 값만 노출합니다. 지정하지 않아도 조회 가능합니다.</small>
            </label>

            <button class="search-button" type="submit" id="submit-button">조회하기</button>
          </form>
        </section>

        <section class="panel result-panel">
          <div class="panel-header result-header-row">
            <div>
              <h2>조회 결과</h2>
              <p id="result-summary">아직 조회 결과가 없습니다.</p>
            </div>
          </div>

          <div id="result-empty" class="empty-state">
            <div class="empty-graphic">⌕</div>
            <div class="empty-title">조회 결과가 여기에 표시됩니다.</div>
            <div class="empty-copy" id="empty-copy">위에서 OS 버전과 선택형 OS 타입을 입력한 뒤 조회 버튼을 눌러주세요.</div>
          </div>

          <div id="result-shell" class="result-shell" hidden>
            <div class="results-table-wrap">
              <table class="results-table">
                <thead id="results-head"></thead>
                <tbody id="results-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
